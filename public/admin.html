<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trend Wear BD — Landing Page Editor</title><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/" class="brand"><b>TD</b> Trend Wear BD</a><button onclick="save()">Save & Publish</button></header><div class="layout"><aside><b>LANDING PAGE</b><button onclick="go('hero')">Hero</button><button onclick="go('categories')">Categories</button><button onclick="go('products')">Products</button><button onclick="go('about')">About</button><button onclick="go('benefits')">Benefits</button><button onclick="go('faq')">FAQ</button><button onclick="go('footer')">Footer</button></aside><main><div class="note">Edit the homepage without touching code. Upload images, add/delete items, then Save & Publish.</div>
<section id="hero"><h2>Hero</h2><div class="grid"><label>Eyebrow<input id="he"></label><label>Heading<textarea id="ht"></textarea></label><label>Subtitle<textarea id="hs"></textarea></label><label>Button text<input id="hb"></label><label>Button link<input id="hl"></label><label>Image URL<input id="hi"></label></div><input type="file" accept="image/*" onchange="upload(this,'hi')"></section>
<section id="categories"><h2>Categories</h2><div id="cats"></div><button class="add" onclick="addCat()">+ Add category</button></section>
<section id="products"><h2>Products</h2><div id="prods"></div><button class="add" onclick="addProd()">+ Add product</button></section>
<section id="about"><h2>About</h2><div class="grid"><label>Title<input id="at"></label><label>Text<textarea id="ax"></textarea></label><label>Image URL<input id="ai"></label></div><input type="file" accept="image/*" onchange="upload(this,'ai')"></section>
<section id="benefits"><h2>Benefits</h2><div id="bens"></div><button class="add" onclick="D.benefits.push({title:'New benefit',text:'Write a short benefit.'});bens()">+ Add benefit</button></section>
<section id="faq"><h2>FAQ</h2><div id="faqs"></div><button class="add" onclick="D.faq.push({q:'New question?',a:'Answer here.'});faqs()">+ Add FAQ</button></section>
<section id="footer"><h2>Footer & contact</h2><div class="grid"><label>WhatsApp number<input id="wn"></label><label>Footer about<textarea id="fa"></textarea></label><label>Facebook URL<input id="fb"></label><label>Instagram URL<input id="ig"></label><label>TikTok URL<input id="tk"></label></div></section></main></div><script src="/admin.js"></script></body></html>
